name: Validate PRs and Main

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Validate Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install LifeOS CLI with Web API extras
        run: |
          CLI_VERSION="$(node scripts/pinned-cli-version.mjs)"
          echo "Pinned lifeos-cli version: ${CLI_VERSION}"
          uv tool install "lifeos-cli[web,postgres]==${CLI_VERSION}"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Fetch main for diff coverage base
        run: git fetch origin main --force

      - name: Run frontend validation
        run: bash ./scripts/validate.sh
